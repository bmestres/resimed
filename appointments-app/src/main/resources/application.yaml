spring:
  application:
    name: appointments-app
  docker:
    compose:
      enabled: false
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
    open-in-view: false
  flyway:
    validate-migration-naming: true

resimed:
  security:
    jwt:
      secret: ${JWT_SECRET}

