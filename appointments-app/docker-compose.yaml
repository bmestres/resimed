services:
  postgres:
    image: postgres:18.1
    environment:
      POSTGRES_DB: appointments
      POSTGRES_USER: appointments
      POSTGRES_PASSWORD: appointments
    ports:
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    networks:
      - appointments-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h localhost -U appointments -d appointments"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:

networks:
  appointments-network:
    name: appointments-network