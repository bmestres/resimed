services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: appointments
      POSTGRES_USER: appointments
      POSTGRES_PASSWORD: appointments
    ports:
      - "5433:5432" # 5433 on the host: a local PostgreSQL already uses 5432
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U appointments -d appointments"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data: